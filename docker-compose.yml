services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: randi
      MYSQL_USER: randi
      MYSQL_PASSWORD: randi
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - randi_mysql:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-urandi", "-prandi"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  randi_mysql:
